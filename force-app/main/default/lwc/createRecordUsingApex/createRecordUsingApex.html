<template>
    <lightning-card title="Create Account Record" icon-name="standard:account">
        <div class="slds-m-around_medium">
            <lightning-input type="text" variant="standard" name="name" label="Account Name" placeholder="Enter Account Name" onchange={handleNameChange} value={accName}></lightning-input >
            <lightning-input type="text" variant="standard" name="fax" label="Account Fax" placeholder="Enter Account Fax" onchange={handleFaxChange} value={accFax}></lightning-input>
           <lightning-button variant="brand" label="Create Record" disabled={isDisabled} onclick={handleClick}></lightning-button>
        </div>
    </lightning-card>
</template>
